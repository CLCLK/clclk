<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e9">
  <link rel="preload" href="fonts/Jua-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <title>일어나, 출근해야지</title>
  <link rel="stylesheet" href="style.css?v=20261113-analog-audio1">
  <link rel="stylesheet" href="start-screen.css?v=20261113-analog-audio1">
  <link rel="stylesheet" href="game-screen.css?v=20261113-analog-audio1">
  <link rel="stylesheet" href="result-scene.css?v=20261113-analog-audio1">
  <link rel="stylesheet" href="analog-ui.css?v=gouache-fixes-1">
  <link rel="stylesheet" href="gouache-game.css?v=3">
  <link rel="preload" href="start-gouache.png?v=3" as="image">
  <link rel="preload" href="gouache-room-v2.png" as="image">
  <link rel="preload" href="gouache-bed.png" as="image">
  <link rel="preload" href="gouache-shallow.png" as="image">
  <link rel="preload" href="gouache-awake.png" as="image">
  <link rel="preload" href="gouache-tickle.png" as="image">
  <link rel="preload" href="gouache-empty.png" as="image">
  <link rel="preload" href="gouache-failure.png" as="image">
  <script src="motion-input.js?v=gouache-1" defer></script>
  <script src="room-effects.js?v=gouache-1" defer></script>
  <script src="camera-framing.js?v=20261113-analog-audio1" defer></script>
  <script src="window-camera.js?v=gouache-1" defer></script>
  <script src="shake-motion.js?v=20261113-analog-audio1" defer></script>
  <script src="tickle-motion.js?v=20261113-analog-audio1" defer></script>
  <script src="wind-motion.js?v=20261113-analog-audio1" defer></script>
  <script src="hand-motion.js?v=20261113-analog-audio1" defer></script>
  <script src="face-motion.js?v=20261113-analog-audio1" defer></script>
  <script src="game-audio.js?v=20261113-analog-audio1" defer></script>
  <script src="script.js?v=gouache-start-2" defer></script>
</head>
<body class="on-start">
  <div class="shell">
    <main>
      <section class="start-screen" id="start-screen" aria-labelledby="game-title">
        <img class="start-illustration" src="start-gouache.png?v=3" width="1672" height="941" alt="" aria-hidden="true">
        <div class="start-hero">
          <h1 id="game-title">일어나,<br><span>출근해야지</span></h1>
          <p class="intro">30초 안에 잠든 직장인을 깨워 주세요!</p>
          <button class="primary" id="start-button" type="button">게임 시작 <span aria-hidden="true">→</span></button>
        </div>

        <section class="start-guide" aria-labelledby="start-guide-title">
          <div class="guide-heading"><h2 id="start-guide-title">깨우는 방법</h2></div>
          <ul class="gesture-cards" id="gesture-guide"></ul>
          <section class="rules-panel" aria-labelledby="rules-title">
            <h2 id="rules-title">게임 규칙</h2>
            <ol class="start-rules">
              <li>8시 전에 졸음 게이지를 0으로!</li>
              <li>같은 방법은 연속으로 효과가 없어요.</li>
            </ol>
          </section>
          <div class="start-camera">
            <label class="start-camera-label" id="camera-toggle-label" for="camera-toggle">웹캠 화면 표시</label>
            <div class="start-camera-controls">
              <button class="preview-button" id="preview-button" type="button" aria-haspopup="dialog">미리보기</button>
              <label class="toggle-control" for="camera-toggle">
                <input type="checkbox" role="switch" id="camera-toggle" aria-labelledby="camera-toggle-label" checked>
                <span class="switch" aria-hidden="true"></span>
                <span id="camera-setting-state" aria-hidden="true">ON</span>
              </label>
            </div>
            <p class="start-camera-help" id="camera-help">ON이면 창문 밖에 내 모습이 나타나요. OFF여도 웹캠 연결과 모션 인식은 유지돼요.</p>
          </div>
          <p class="start-camera-status" id="start-camera-status" role="status" hidden></p>
        </section>

        <dialog class="start-preview" id="start-preview" aria-labelledby="start-preview-title">
          <h2 id="start-preview-title">웹캠 미리보기</h2>
          <div class="start-preview-window" aria-hidden="true">
            <div class="start-preview-room" id="start-preview-room"></div>
          </div>
          <p class="start-camera-status" id="preview-camera-status" role="status"></p>
          <form method="dialog"><button class="preview-button" type="submit" autofocus>닫기</button></form>
        </dialog>
      </section>

      <section class="play-screen" id="play-screen" aria-label="게임 화면" tabindex="-1" hidden>
        <div class="repeat-popup" id="repeat-popup" role="status" aria-live="polite" hidden>
          <p>같은 방법을 연속으로 쓰면 효과가 없어요. 다른 방법으로 깨워주세요.</p>
        </div>
        <div class="room-viewport">
        <div class="game-room" id="game-room" role="group" aria-label="아침의 자취방과 이불 속에 잠든 캐릭터">
          <div class="room-art room-backdrop" aria-hidden="true"></div>
          <div class="room-window" id="game-window" aria-hidden="true">
            <canvas class="window-camera" id="window-camera" width="800" height="500"></canvas>
          </div>
          <div class="room-sleep" aria-hidden="true">
            <span style="--x: 13.6%; --y: 47.3%; --angle: -17deg; --delay: 0s">Z</span>
            <span style="--x: 15.1%; --y: 44.9%; --angle: 15deg; --delay: -0.8s">Z</span>
            <span style="--x: 13.45%; --y: 42.4%; --angle: -13deg; --delay: -1.6s">Z</span>
          </div>
          <div class="quake-layer quake-table" aria-hidden="true"><div class="room-art"></div></div>
          <div class="quake-layer quake-floor" aria-hidden="true"><div class="room-art"></div></div>
          <div class="room-art quake-object quake-bed" aria-hidden="true">
            <div class="room-art face-art sleep-face" id="sleep-face" data-expression="deep"></div>
            <div class="room-art face-art tickle-face"></div>
            <div class="room-art face-art failure-face"></div>
          </div>
          <div class="room-art victory-bed" aria-hidden="true"></div>
          <div class="shelf-shadow" aria-hidden="true"></div>
          <div class="room-art quake-object quake-shelf" aria-hidden="true"></div>
          <div class="shake-lines" aria-hidden="true">
            <span style="--x: 28.8%; --y: 48.3%; --angle: 126deg"></span>
            <span style="--x: 50.3%; --y: 73%; --angle: 193deg"></span>
            <span class="shelf-mark" style="--x: 70.2%; --y: 47%; --angle: 12deg"></span>
            <span class="shelf-mark" style="--x: 89.7%; --y: 40.5%; --angle: 147deg"></span>
            <span style="--x: 81%; --y: 79%; --angle: 195deg"></span>
          </div>
          <canvas class="room-effects" id="room-effects" width="1586" height="992" aria-hidden="true"></canvas>
          <div class="victory-shadow" aria-hidden="true"></div>
          <img class="victory-pose" src="gouache-victory.png" alt="" aria-hidden="true">
          <div class="room-clock" aria-label="게임 속 시각"><time id="game-clock" datetime="07:00">07:00</time></div>
          <p class="game-camera-status" id="game-camera-status" role="status" hidden></p>
          <section class="round-result" id="result-screen" aria-labelledby="result-title" hidden>
            <span class="result-stamp" id="result-stamp" aria-hidden="true"></span>
            <span class="result-eyebrow" id="result-eyebrow"></span>
            <h2 id="result-title" tabindex="-1"></h2>
            <p id="result-message"></p>
            <div class="result-actions"><button id="result-replay-button" type="button">다시 도전하기 <span aria-hidden="true">↗</span></button><button id="restart-button" type="button">시작 화면으로</button></div>
          </section>
          <div class="scene-overlay" id="countdown-overlay" hidden>
            <span>곧 시작합니다</span>
            <strong id="countdown" role="status">3</strong>
          </div>
        </div>

        </div>
        <div class="game-controls">
          <div class="sleep-control">
            <div class="sleep-heading"><label for="sleep-meter"><span class="sleep-symbol" aria-hidden="true">Zz</span> 졸음 게이지</label><strong id="sleep-value">100 / 100</strong></div>
            <progress id="sleep-meter" max="100" value="100"></progress>
            <div class="sleep-scale" aria-hidden="true"><span>완전히 깸</span><span>아직 꿈나라</span></div>
            <p id="feedback" class="feedback" role="status"></p>
          </div>
          <div class="attack-buttons" id="test-buttons" role="group" aria-label="깨우기 공격"></div>
          <div class="game-actions">
            <button id="sound-button" type="button" aria-pressed="true" aria-label="게임 소리"><span aria-hidden="true">♫</span> SOUND <strong id="sound-state">ON</strong></button>
            <button id="replay-button" type="button"><span aria-hidden="true">↻</span> 다시 하기</button>
            <button id="back-button" type="button"><span aria-hidden="true">←</span> 돌아가기</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
