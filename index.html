<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e9">
  <title>일어나 출근해야지</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game-screen.css">
  <script src="motion-input.js" defer></script>
  <script src="room-effects.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="wordmark"><span aria-hidden="true">☀</span> 모닝 알람</div>
      <div class="schedule"><span aria-hidden="true">◷</span> 07:00 — 08:00</div>
    </header>

    <main class="layout">
      <div class="panel">
        <section id="start-screen" aria-labelledby="game-title">
          <h1 id="game-title">일어나<br><span>출근해야지</span></h1>
          <p class="intro">오전 8시까지 60초. 네 가지 공격으로<br class="desktop-break"> 이불 속 캐릭터를 깨워 주세요.</p>

          <div class="guide">
            <h2>동작 안내</h2>
            <p>공격 버튼을 누를 때마다 졸음이 10씩 줄어요.</p>
            <ul class="gesture-list" id="gesture-guide"></ul>
          </div>

          <label class="camera-setting" for="camera-toggle">
            <span><strong>웹캠 화면 표시</strong><small>테스트용 자리 표시</small></span>
            <span class="toggle-control">
              <input type="checkbox" role="switch" id="camera-toggle">
              <span class="switch" aria-hidden="true"></span>
              <span id="camera-setting-state" aria-hidden="true">OFF</span>
            </span>
          </label>
          <button class="primary" id="start-button" type="button">게임 시작 <span aria-hidden="true">→</span></button>
        </section>

        <section id="result-screen" aria-labelledby="result-title" hidden>
          <h2 class="section-title result-title" id="result-title" tabindex="-1"></h2>
          <p class="intro" id="result-message"></p>
          <button class="primary" id="restart-button" type="button">다시 시작 <span aria-hidden="true">↻</span></button>
        </section>
      </div>

      <div class="scene" id="scene">
        <img class="bedroom" src="bedroom.webp" alt="아침 햇살이 들어오는 방에서 이불을 덮고 잠든 캐릭터">
        <span class="scene-label" id="scene-label">☀ 아침 7시, 침실</span>
        <div class="scene-overlay result-overlay" id="result-overlay" aria-hidden="true" hidden>
          <span id="result-icon"></span>
        </div>
      </div>

      <section class="play-screen" id="play-screen" aria-label="게임 화면" tabindex="-1" hidden>
        <div class="game-room" id="game-room" role="group" aria-label="아침의 자취방과 이불 속에 잠든 캐릭터">
          <div class="room-art room-backdrop" aria-hidden="true"></div>
          <div class="room-window" aria-hidden="true">
            <div class="room-pane room-pane-left"></div>
            <div class="room-pane room-pane-right"></div>
          </div>
          <div class="room-art room-sleep" aria-hidden="true"></div>
          <div class="quake-layer quake-table" aria-hidden="true"><div class="room-art"></div></div>
          <div class="quake-layer quake-floor" aria-hidden="true"><div class="room-art"></div></div>
          <div class="room-art quake-object quake-bed" aria-hidden="true">
            <div class="room-art tickle-face"></div>
          </div>
          <div class="room-art quake-object quake-shelf" aria-hidden="true"></div>
          <div class="shake-lines" aria-hidden="true">
            <span style="--x: 28.8%; --y: 48.3%; --angle: 126deg"></span>
            <span style="--x: 50.3%; --y: 73%; --angle: 193deg"></span>
            <span style="--x: 70.2%; --y: 47%; --angle: 12deg"></span>
            <span style="--x: 89.7%; --y: 40.5%; --angle: 147deg"></span>
            <span style="--x: 81%; --y: 79%; --angle: 195deg"></span>
          </div>
          <canvas class="room-effects" id="room-effects" width="1586" height="992" aria-hidden="true"></canvas>
          <div class="room-clock" aria-label="게임 속 시각"><time id="game-clock" datetime="07:00">07:00</time></div>
          <span class="camera-example-label" id="camera-preview" hidden>웹캠 합성 예시</span>
          <div class="scene-overlay" id="countdown-overlay" hidden>
            <span>곧 시작합니다</span>
            <strong id="countdown" role="status">3</strong>
          </div>
        </div>

        <div class="game-controls">
          <div class="sleep-control">
            <div class="sleep-heading"><label for="sleep-meter">졸음 게이지</label><strong id="sleep-value">100 / 100</strong></div>
            <progress id="sleep-meter" max="100" value="100"></progress>
            <p id="feedback" class="feedback" role="status"></p>
          </div>
          <div class="attack-buttons" id="test-buttons" role="group" aria-label="깨우기 공격"></div>
          <div class="game-actions">
            <button id="sound-button" type="button" aria-pressed="true" aria-label="게임 소리"><span aria-hidden="true">♫</span> SOUND <strong id="sound-state">ON</strong></button>
            <button id="replay-button" type="button"><span aria-hidden="true">↻</span> 다시 하기</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
